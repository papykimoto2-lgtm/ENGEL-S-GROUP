<style>

  const BG = [['#d4202a','#7a0914'],['#c4161f','#5e0610'],['#8c0f1c','#3a050c'],['#d02a30','#750a14'],

  /* ============ Texture du design de la canette ============ */
  function flower(g, cx, cy, r, rot, mono) {

  function arcText(g, text, cx, cy, r, ca, px, bottom) {

    g.fillStyle = ig; g.beginPath(); g.arc(cx, cy, rad * .6, 0, TAU); g.fill();
    g.lineWidth = rad * .035; g.beginPath(); g.arc(cx, cy, rad * .6, 0, TAU); g.stroke();
    arcText(g, 'NATURELLEMENT', cx, cy, rad * .77, -Math.PI / 2, rad * .17, false);
    arcText(g, 'BISSAP AUTHENTIQUE', cx, cy, rad * .77, Math.PI / 2, rad * .15, true);

    for (let i = 0; i < 3; i++) { g.save(); g.rotate(i * TAU / 3);

    g.restore();

  function drawFront(g, cx) {
    g.save(); g.globalAlpha = .95; flower(g, cx - 110, 330, 235, -.25, false); g.restore();
    g.save(); g.translate(cx + 150, 790); g.rotate(.55);
    const lg = g.createLinearGradient(-80, 0, 80, 0); lg.addColorStop(0, '#1d6fb8'); lg.addColorStop(1, '#27b5a0');
    g.fillStyle = lg; g.beginPath(); g.moveTo(-90, 0); g.quadraticCurveTo(0, -90, 110, 0); g.quadraticCurveTo(0, 70, -90, 0); g.fill();

    g.save(); g.translate(cx, 640); g.rotate(-.07);
    let px = 300; g.font = '700 ' + px + 'px ' + FONT; const tw = g.measureText("B'ssap").width;
    if (tw > 720) { px = Math.floor(px * 720 / tw); g.font = '700 ' + px + 'px ' + FONT; }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.shadowColor = 'rgba(70,0,0,.55)'; g.shadowBlur = 26; g.shadowOffsetY = 12; g.lineWidth = 16; g.strokeStyle = 'rgba(255,255,255,.18)';
    g.strokeText("B'ssap", 0, 0); g.shadowColor = 'transparent'; g.fillStyle = '#fff'; g.fillText("B'ssap", 0, 0); g.restore();
    g.save(); g.fillStyle = 'rgba(255,255,255,.9)'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '600 38px ' + FONT; if ('letterSpacing' in g) g.letterSpacing = '10px'; g.fillText('HIBISCUS', cx, 940);
    g.font = '500 30px ' + FONT; g.fillText('33 cl', cx, 995); g.restore();
    seal(g, cx - 205, 140, 66);
  }
  function drawBack(g, cx) {
    g.save(); g.fillStyle = '#fff'; g.textAlign = 'left';
    const x0 = cx - 190; g.font = '700 46px ' + FONT; g.fillText('Hibiscus', x0, 230); g.font = '500 22px ' + FONT;
    ["Boisson rafraîchissante à base", "d'infusion de fleurs d'hibiscus.", "Sans conservateur.", "", "Ingrédients : eau, sucre,", "extrait d'hibiscus (8 %),", "arômes naturels."]
      .forEach((t, i) => g.fillText(t, x0, 275 + i * 29));
    const ty = 500, rowH = 40, tw = 380; g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3; g.strokeRect(x0, ty, tw, rowH * 7);
    g.font = '700 24px ' + FONT; g.fillText('Pour 100 ml', x0 + 10, ty + 28);
    const rows = [['Énergie', '38 kJ / 9 kcal'], ['Matières grasses', '1 g'], ['Glucides', '2,1 g'], ['dont sucres', '2 g'], ['Protéines', '0 g'], ['Sel', '0 g']];

  }
  function makeLabelTexture(renderer) {
    const W = 2048, H = 1180, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');

  /* ============ Renderer, scène, environnement ============ */
  await Promise.race([document.fonts.load('700 100px Fredoka').catch(() => {}), new Promise(r => setTimeout(r, 1800))]);

  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
  catch (e) { document.getElementById('err').style.display = 'grid'; return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1, .1, 50);

  (function () {
    const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.MeshBasicMaterial({ color: 0x151012, side: THREE.BackSide })));
    const box = (w, h, x, y, z, col, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
    box(7, 1.2, 0, 7, 0, 0xffffff, 9); box(1.2, 8, -6, 0, 3, 0xffffff, 7); box(1.2, 8, 6, 0, 3, 0xffe9d6, 6); box(5, 1.5, 0, -1, -7, 0xffffff, 3); box(6, .8, 0, -5, 3, 0xffd2c8, 2);

      const minX = 8 + (side < 0 ? lw : 0), maxX = W - 8 - (side > 0 ? lw : 0); lx = Math.max(minX, Math.min(maxX, lx));
      o.el.style.opacity = o.a; o.el.style.transform = `translate(${ax}px,${ay}px)`;
      o.lab.style.left = (side < 0 ? lx - ax - lw : lx - ax) + 'px'; o.lab.style.top = (ly - ay - lh / 2) + 'px';
      o.ln.setAttribute('x1', ax); o.ln.setAttribute('y1', ay); o.ln.setAttribute('x2', lx); o.ln.setAttribute('y2', ly); o.ln.setAttribute('opacity', o.a);
      if (o.a > .5 && !o.counted && o.nums.length) { o.counted = true; o.nums.forEach(b => { const ob = { v: 0 }, n = +b.dataset.n; gsap.to(ob, { v: n, duration: 1.2, onUpdate: () => b.textContent = Math.round(ob.v) }); }); }
    });
  }

  /* ============ Boucle de rendu ============ */
  let t0 = performance.now(), t = 0;
  const v3 = new THREE.Vector3(), rise = 1;
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min((now - t0) / 1000, .05); t0 = now; t += dt;
    spinAngle += dt * .75 * state.spin;
    root.position.set(state.x, state.y, 0); root.scale.setScalar(state.s);
    floatG.position.y = Math.sin(t * 1.4) * .02 * (state.pour > .05 ? 0 : 1);
    pivot.rotation.set(state.rx, 0, state.rz);
    can.rotation.y = state.ry + spinAngle + Math.sin(t * .7) * .12 * (1 - state.spin);
    tabG.rotation.z = state.tab;
    shadow.position.set(state.x, state.y - .575 * state.s - .015, 0); shadow.material.opacity = state.shadow * (.8 + Math.sin(t * 1.4) * .12); shadow.scale.setScalar(state.s * (1 + Math.sin(t * 1.4) * .035));

    // verre
    glassG.visible = state.glass > .01; glassG.position.y = -.575 * L.rit + (1 - state.glass) * .35; glassG.scale.setScalar((.7 + .3 * state.glass) * L.gs);
    glassMat.opacity = .2 * state.glass; liqMat.opacity = .96 * state.glass; iceMat.opacity = .55 * state.glass;
    const h = Math.max(.001, state.level * LIQ_H); liquid.scale.y = h; liquid.position.y = .045 + h / 2; liquid.visible = state.level > .005;
    ice.forEach(m => { const u = m.userData; m.position.set(u.x, .08 + state.level * .17 + Math.sin(t * 1.2 + u.r) * .006, u.z); m.rotation.set(u.r + t * .05, u.r * 2, u.r); });

    // filet de liquide
    stage.updateMatrixWorld(); mouth.getWorldPosition(v3); stage.worldToLocal(v3);
    const topY = glassG.position.y + (.045 + h) * glassG.scale.y, len = Math.max(0, (v3.y - .005 - topY) * Math.min(1, state.pour * 1.6));
    stream.visible = state.pour > .02 && len > .01 && state.glass > .5;
    if (stream.visible) { const r = .011 * state.pour + Math.sin(t * 30) * .0008; stream.scale.set(r, len, r); stream.position.set(v3.x, v3.y - len / 2 - .005, 0); }

    // pétales
    const sy = scrollY / Math.max(1, innerHeight);
    for (let i = 0; i < PN; i++) { const p = pd[i]; p.y -= p.v * dt; if (p.y < -1.7) { p.y = 1.7; p.x = (Math.random() - .5) * 5; }
      dummy.position.set(p.x + Math.sin(t * .6 + p.ph) * .15, p.y + L.offY * .5, p.z); dummy.rotation.set(t * p.rs + p.ax, t * p.rs * .7, t * p.rs * .5 + p.ph); dummy.scale.setScalar(p.s * (L.mobile ? .8 : 1)); dummy.updateMatrix(); petals.setMatrixAt(i, dummy.matrix); }
    petals.instanceMatrix.needsUpdate = true; petals.visible = true;
    camera.position.x = Math.sin(t * .3) * .04; camera.lookAt(0, 0, 0); camera.updateMatrixWorld(); stage.updateMatrixWorld(true); updateCallouts();
    renderer.render(scene, camera);
  });

  /* ============ Entrée ============ */
  let started = false;
  function start(withVoice) {
    started = true; const intro = document.getElementById('intro');
    if (withVoice) { initAudio(); voiceOn = true; btnVoice.classList.add('on'); btnVoice.textContent = '🔊 Voix'; }
    else { voiceOn = false; btnVoice.classList.remove('on'); btnVoice.textContent = '🔇 Voix'; }
    gsap.to(intro, { opacity: 0, duration: .8, onComplete: () => intro.remove() });
    document.documentElement.classList.remove('locked');
    // intro : la canette tombe du haut
    state.y = 2.2; state.s = .6; cur = -1; activate(0);
    gsap.fromTo(state, { y: 2.2, s: .6 }, { y: 0, s: poses(0).s, duration: 1.8, ease: 'bounce.out', overwrite: 'auto', delay: .2 });
    gsap.from(heroWord, { yPercent: 12, duration: 1.4, ease: 'power3.out' });
    gsap.from('header, nav#dots', { opacity: 0, duration: 1, delay: .6 });
    if (withVoice) setTour(true);
    ScrollTrigger.refresh();
  }
  document.getElementById('goTour').onclick = () => start(true);
  document.getElementById('goFree').onclick = () => start(false);
  window.__bssap = { activate, state, start, get cur() { return cur; } };
  gsap.set(heroWord, { opacity: 0 });
})();
</script>
