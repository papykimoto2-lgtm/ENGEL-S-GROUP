<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B'ssap 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #3a0509;
    --bg2: #12060a;
    --ink: #fff;
    --muted: rgba(255,255,255,.62);
    --chip: rgba(255,255,255,.08);
    --chip-hover: rgba(255,255,255,.18);
    --accent: #ff4d5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 42%, var(--bg1) 0%, var(--bg2) 72%);
    color: var(--ink);
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#stage.dragging { cursor: grabbing; }
  header {
    position: fixed; top: 0; left: 0; right: 0; padding: 22px 16px 0; text-align: center; pointer-events: none;
  }
  header h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); font-weight: 700; letter-spacing: .02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .18em; text-transform: uppercase; }
  .controls {
    position: fixed; left: 0; right: 0; bottom: 18px; padding: 0 16px;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .controls button {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--chip);
    border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 8px 18px; cursor: pointer;
    backdrop-filter: blur(6px); transition: background .2s, transform .2s;
  }
  .controls button:hover { background: var(--chip-hover); }
  .controls button:active { transform: scale(.96); }
  .controls button.on { background: var(--accent); border-color: var(--accent); }
  .hint { position: fixed; bottom: 66px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<header>
  <h1>B'ssap</h1>
  <p>Hibiscus · 33 cl</p>
</header>
<div class="hint">Glisse pour faire tourner la canette</div>
<div class="controls">
  <button id="btnSpin" class="on">⏸ Pause</button>
  <button data-view="front">Face</button>
  <button data-view="back">Dos</button>
  <button data-view="top">Dessus</button>
  <button data-view="bottom">Dessous</button>
</div>
<div id="err">WebGL n'est pas disponible sur cet appareil.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  "use strict";
  const TAU = Math.PI * 2;
  const FONT = '"Fredoka", "Trebuchet MS", sans-serif';

  /* ---------- Dimensions (1 unité = 10 cm) : 115 mm x 53 mm ---------- */
  const R = 0.265;            // rayon du corps
  const Y_BODY_TOP = 0.46;
  const Y_BODY_BOT = -0.50;

  /* =================================================================
     1. Texture du design (canvas 2D) enroulée autour du corps
     ================================================================= */
  function flower(g, cx, cy, r, rot, mono) {
    g.save();
    g.translate(cx, cy);
    g.rotate(rot);
    for (let i = 0; i < 5; i++) {
      g.save();
      g.rotate(i * TAU / 5);
      const grad = g.createRadialGradient(0, 0, r * 0.05, 0, -r * 0.6, r * 0.9);
      if (mono) { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#e8fff8'); }
      else { grad.addColorStop(0, '#8a0f1c'); grad.addColorStop(0.35, '#e8334a'); grad.addColorStop(1, '#ff8d99'); }
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(0, 0);
      g.bezierCurveTo(-r * 0.75, -r * 0.25, -r * 0.85, -r * 1.1, -r * 0.1, -r * 1.05);
      g.bezierCurveTo(r * 0.55, -r * 1.12, r * 0.85, -r * 0.3, 0, 0);
      g.fill();
      if (!mono) {
        g.strokeStyle = 'rgba(255,255,255,.28)';
        g.lineWidth = Math.max(1, r * 0.012);
        for (let k = -2; k <= 2; k++) {
          g.beginPath(); g.moveTo(0, -r * 0.1);
          g.quadraticCurveTo(k * r * 0.12, -r * 0.55, k * r * 0.2, -r * 0.95);
          g.stroke();
        }
      }
      g.restore();
    }
    if (!mono) {
      g.strokeStyle = '#ffd3a0'; g.lineWidth = r * 0.04; g.lineCap = 'round';
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(r * 0.2, -r * 0.5, r * 0.55, -r * 0.62); g.stroke();
      g.fillStyle = '#ffc93c';
      for (let k = 0; k < 6; k++) {
        g.beginPath(); g.arc(r * (0.38 + k * 0.035), -r * (0.46 + k * 0.026), r * 0.045, 0, TAU); g.fill();
      }
    }
    g.restore();
  }

  function arcText(g, text, cx, cy, r, centerAngle, px, bottom) {
    g.save();
    g.translate(cx, cy);
    g.font = '700 ' + px + 'px ' + FONT;
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const sp = px * 0.12, dir = bottom ? -1 : 1;
    const w = [...text].map(ch => g.measureText(ch).width + sp);
    const total = w.reduce((a, b) => a + b, 0);
    let a = centerAngle - dir * total / r / 2;
    [...text].forEach((ch, i) => {
      a += dir * (w[i] / 2) / r;
      g.save();
      if (bottom) { g.rotate(a - Math.PI / 2); g.fillText(ch, 0, r); }
      else { g.rotate(a + Math.PI / 2); g.fillText(ch, 0, -r); }
      g.restore();
      a += dir * (w[i] / 2) / r;
    });
    g.restore();
  }

  function seal(g, cx, cy, rad) {
    g.save();
    g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = rad * 0.2; g.shadowOffsetY = rad * 0.06;
    g.fillStyle = '#0d7d8e';
    g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fill();
    g.restore();
    g.strokeStyle = '#fff'; g.lineWidth = rad * 0.05;
    g.beginPath(); g.arc(cx, cy, rad * 0.93, 0, TAU); g.stroke();
    const ig = g.createLinearGradient(cx, cy - rad, cx, cy + rad);
    ig.addColorStop(0, '#46d1b0'); ig.addColorStop(1, '#14909d');
    g.fillStyle = ig;
    g.beginPath(); g.arc(cx, cy, rad * 0.6, 0, TAU); g.fill();
    g.lineWidth = rad * 0.035;
    g.beginPath(); g.arc(cx, cy, rad * 0.6, 0, TAU); g.stroke();
    arcText(g, 'NATURELLEMENT', cx, cy, rad * 0.77, -Math.PI / 2, rad * 0.17, false);
    arcText(g, 'BISSAP AUTHENTIQUE', cx, cy, rad * 0.77, Math.PI / 2, rad * 0.15, true);
    flower(g, cx, cy + rad * 0.04, rad * 0.3, 0.3, true);
  }

  function recycle(g, cx, cy, r) {
    g.save();
    g.translate(cx, cy);
    g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = r * 0.22; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      g.save(); g.rotate(i * TAU / 3);
      g.beginPath(); g.arc(0, 0, r, -Math.PI / 2 + 0.2, -Math.PI / 2 + 1.6); g.stroke();
      const ax = Math.cos(-Math.PI / 2 + 1.75) * r, ay = Math.sin(-Math.PI / 2 + 1.75) * r;
      g.beginPath(); g.moveTo(ax + r * 0.34, ay - r * 0.28); g.lineTo(ax - r * 0.05, ay + r * 0.35); g.lineTo(ax - r * 0.4, ay - r * 0.12); g.closePath(); g.fill();
      g.restore();
    }
    g.restore();
  }

  function drawFront(g, cx) {
    // grande fleur d'hibiscus, en haut à gauche du logo
    g.save();
    g.globalAlpha = 0.95;
    flower(g, cx - 110, 330, 235, -0.25, false);
    g.restore();

    // feuille bleue/verte sous le logo
    g.save();
    g.translate(cx + 150, 790); g.rotate(0.55);
    const lg = g.createLinearGradient(-80, 0, 80, 0);
    lg.addColorStop(0, '#1d6fb8'); lg.addColorStop(1, '#27b5a0');
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(-90, 0); g.quadraticCurveTo(0, -90, 110, 0); g.quadraticCurveTo(0, 70, -90, 0); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-80, 0); g.lineTo(100, 0); g.stroke();
    g.restore();

    // logo B'ssap
    g.save();
    g.translate(cx, 640); g.rotate(-0.07);
    let px = 300;
    g.font = '700 ' + px + 'px ' + FONT;
    const tw = g.measureText("B'ssap").width;
    if (tw > 720) { px = Math.floor(px * 720 / tw); g.font = '700 ' + px + 'px ' + FONT; }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round';
    g.shadowColor = 'rgba(70,0,0,.55)'; g.shadowBlur = 26; g.shadowOffsetY = 12;
    g.lineWidth = 16; g.strokeStyle = 'rgba(255,255,255,.18)';
    g.strokeText("B'ssap", 0, 0);
    g.shadowColor = 'transparent';
    g.fillStyle = '#fff';
    g.fillText("B'ssap", 0, 0);
    g.restore();

    // petites mentions
    g.save();
    g.fillStyle = 'rgba(255,255,255,.9)'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '600 38px ' + FONT;
    if ('letterSpacing' in g) g.letterSpacing = '10px';
    g.fillText('HIBISCUS', cx, 940);
    g.font = '500 30px ' + FONT;
    g.fillText('33 cl', cx, 995);
    g.restore();

    seal(g, cx - 205, 140, 66);
  }

  function drawBack(g, cx) {
    g.save();
    g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
    g.textAlign = 'left';
    const x0 = cx - 190;
    g.font = '700 46px ' + FONT;
    g.fillText('Hibiscus', x0, 230);
    g.font = '500 22px ' + FONT;
    const lines = [
      "Boisson rafraîchissante à base",
      "d'infusion de fleurs d'hibiscus.",
      "Sans conservateur.",
      "",
      "Ingrédients : eau, sucre,",
      "extrait d'hibiscus (8 %),",
      "arôme naturel.",
    ];
    lines.forEach((t, i) => g.fillText(t, x0, 275 + i * 29));

    // tableau nutritionnel
    const ty = 500, rowH = 40, tw = 380;
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3;
    g.strokeRect(x0, ty, tw, rowH * 7);
    g.font = '700 24px ' + FONT;
    g.fillText('Pour 100 ml', x0 + 10, ty + 28);
    const rows = [['Énergie', '180 kJ / 43 kcal'], ['Matières grasses', '0 g'], ['Glucides', '10,5 g'],
                  ['dont sucres', '10,2 g'], ['Protéines', '0 g'], ['Sel', '0 g']];
    g.font = '500 22px ' + FONT;
    rows.forEach((r, i) => {
      const y = ty + rowH * (i + 1);
      g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + tw, y); g.lineWidth = 1.5; g.stroke();
      g.textAlign = 'left'; g.fillText(r[0], x0 + 10, y + 28);
      g.textAlign = 'right'; g.fillText(r[1], x0 + tw - 10, y + 28);
    });
    g.textAlign = 'left';
    recycle(g, x0 + 28, 935, 26);
    g.font = '700 34px ' + FONT;
    g.textAlign = 'right';
    g.fillText('33 cl', x0 + tw, 950);
    g.restore();
  }

  function makeLabelTexture(renderer) {
    const W = 2048, H = 1180;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');

    const base = g.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0, '#9e0f18'); base.addColorStop(0.5, '#cf1822'); base.addColorStop(1, '#990e16');
    g.fillStyle = base; g.fillRect(0, 0, W, H);

    // léger éclat horizontal pour donner du volume au rouge
    const sh = g.createLinearGradient(0, 0, W, 0);
    sh.addColorStop(0, 'rgba(0,0,0,.10)'); sh.addColorStop(0.25, 'rgba(255,255,255,.04)');
    sh.addColorStop(0.5, 'rgba(0,0,0,.06)'); sh.addColorStop(0.75, 'rgba(255,255,255,.04)'); sh.addColorStop(1, 'rgba(0,0,0,.10)');
    g.fillStyle = sh; g.fillRect(0, 0, W, H);

    drawFront(g, W / 2);
    drawBack(g, 0); drawBack(g, W);
    seal(g, 1600, 250, 78);        // sceau visible sur le côté droit

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.offset.x = 0.5;            // le centre du canvas (face) regarde la caméra
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  /* =================================================================
     2. Scène Three.js
     ================================================================= */
  const canvas = document.getElementById('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (e) {
    document.getElementById('err').style.display = 'grid';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);

  // Environnement studio (softboxes) pour des reflets métal réalistes
  (function buildEnv() {
    const env = new THREE.Scene();
    const room = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16),
      new THREE.MeshBasicMaterial({ color: 0x151012, side: THREE.BackSide }));
    env.add(room);
    function box(w, h, x, y, z, col, k) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
    }
    box(7, 1.2, 0, 7, 0, 0xffffff, 9);         // dessus
    box(1.2, 8, -6, 0, 3, 0xffffff, 7);        // bande gauche
    box(1.2, 8, 6, 0, 3, 0xffe9d6, 6);         // bande droite chaude
    box(5, 1.5, 0, -1, -7, 0xffffff, 3);       // contre-jour
    box(6, 0.8, 0, -5, 3, 0xffd2c8, 2);        // rebond sol
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.02).texture;
    pm.dispose();
  })();

  scene.add(new THREE.AmbientLight(0xffffff, 0.15));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(2, 3, 4); scene.add(key);

  // Hiérarchie : root (intro) > floatG (lévitation) > pivot (inclinaison) > can (rotation)
  const root = new THREE.Group(), floatG = new THREE.Group(), pivot = new THREE.Group(), can = new THREE.Group();
  scene.add(root); root.add(floatG); floatG.add(pivot); pivot.add(can);

  const labelTex = makeLabelTexture(renderer);
  const bodyMat = new THREE.MeshPhysicalMaterial({
    map: labelTex, metalness: 0.55, roughness: 0.32, clearcoat: 0.8, clearcoatRoughness: 0.12, envMapIntensity: 1.1,
  });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0xdfe3e8, metalness: 1, roughness: 0.26, envMapIntensity: 1.2 });
  const darkMetal = new THREE.MeshStandardMaterial({ color: 0x8d9298, metalness: 1, roughness: 0.45 });

  // Corps
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, Y_BODY_TOP - Y_BODY_BOT, 160, 1, true), bodyMat);
  body.position.y = (Y_BODY_TOP + Y_BODY_BOT) / 2;
  can.add(body);

  // Épaule + couvercle (profil de révolution)
  const topProfile = [
    [R, Y_BODY_TOP], [R - 0.002, 0.472], [R - 0.012, 0.495], [R - 0.03, 0.52], [R - 0.05, 0.54],
    [0.212, 0.553], [0.208, 0.565], [0.214, 0.574], [0.222, 0.576], [0.226, 0.570],
    [0.221, 0.560], [0.212, 0.552], [0.2, 0.548], [0.19, 0.549], [0.0, 0.549],
  ].map(p => new THREE.Vector2(p[0], p[1]));
  can.add(new THREE.Mesh(new THREE.LatheGeometry(topProfile, 160), metalMat));

  // Fond (dôme concave)
  const botProfile = [
    [R, Y_BODY_BOT], [R - 0.003, -0.512], [R - 0.014, -0.535], [R - 0.03, -0.558], [R - 0.042, -0.568],
    [0.213, -0.572], [0.205, -0.566], [0.195, -0.552], [0.17, -0.54], [0.12, -0.526], [0.0, -0.52],
  ].map(p => new THREE.Vector2(p[0], p[1]));
  const bottom = new THREE.Mesh(new THREE.LatheGeometry(botProfile, 160), metalMat);
  bottom.material = metalMat.clone(); bottom.material.side = THREE.DoubleSide;
  can.add(bottom);

  // Languette
  (function buildTab() {
    const L = 0.2, Wd = 0.118, rr = 0.058;
    const s = new THREE.Shape();
    s.moveTo(-L / 2 + rr, -Wd / 2);
    s.lineTo(L / 2 - rr, -Wd / 2); s.quadraticCurveTo(L / 2, -Wd / 2, L / 2, 0);
    s.quadraticCurveTo(L / 2, Wd / 2, L / 2 - rr, Wd / 2);
    s.lineTo(-L / 2 + rr, Wd / 2); s.quadraticCurveTo(-L / 2, Wd / 2, -L / 2, 0);
    s.quadraticCurveTo(-L / 2, -Wd / 2, -L / 2 + rr, -Wd / 2);
    const hole = new THREE.Path(); hole.absellipse(0.052, 0, 0.034, 0.036, 0, TAU, true);
    s.holes.push(hole);
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.008, bevelEnabled: true, bevelSize: 0.004, bevelThickness: 0.003, bevelSegments: 3, curveSegments: 32 });
    const tab = new THREE.Mesh(geo, metalMat);
    tab.rotation.x = -Math.PI / 2;
    tab.position.set(-0.012, 0.556, 0);
    can.add(tab);
    const rivet = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.026, 0.016, 32), metalMat);
    rivet.position.set(-0.03, 0.555, 0); can.add(rivet);
    // ouverture ovale
    const opening = new THREE.Mesh(new THREE.CircleGeometry(1, 48), darkMetal);
    opening.scale.set(0.07, 0.045, 1);
    opening.rotation.x = -Math.PI / 2;
    opening.position.set(0.1, 0.5495, 0); can.add(opening);
  })();

  // Ombre portée (disque flou)
  const shadow = (function () {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,.65)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = -0.74;
    root.add(m);
    return m;
  })();

  /* =================================================================
     3. Taille / caméra
     ================================================================= */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const dist = w / h < 0.8 ? 3.2 / Math.max(w / h, 0.42) * 0.62 : 3.3;
    camera.position.set(0, 0.1, dist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* =================================================================
     4. Animations GSAP + interaction
     ================================================================= */
  const btnSpin = document.getElementById('btnSpin');
  let spin = null, playing = true, dragging = false, resumeTimer = null;

  function startSpin() {
    if (spin) spin.kill();
    spin = gsap.to(can.rotation, { y: can.rotation.y + TAU, duration: 9, ease: 'none', repeat: -1 });
    playing = true; btnSpin.textContent = '⏸ Pause'; btnSpin.classList.add('on');
  }
  function stopSpin() {
    if (spin) spin.kill(); spin = null;
    playing = false; btnSpin.textContent = '▶ Lecture'; btnSpin.classList.remove('on');
  }
  function levelOut() { gsap.to(pivot.rotation, { x: 0, duration: 0.8, ease: 'power2.out' }); }

  // Introduction : la canette tombe, tourne et se stabilise
  root.position.y = 2.2; root.scale.setScalar(0.8);
  can.rotation.y = -TAU;
  gsap.timeline({ defaults: { ease: 'power3.out' } })
    .to(root.position, { y: 0, duration: 1.6, ease: 'bounce.out' }, 0)
    .to(root.scale, { x: 1, y: 1, z: 1, duration: 1.2 }, 0)
    .to(can.rotation, { y: 0, duration: 2.2 }, 0)
    .add(startSpin)
    .from('header', { opacity: 0, y: -16, duration: 1 }, 0.3)
    .from('.controls, .hint', { opacity: 0, y: 16, duration: 0.8 }, 1.2);

  // Lévitation douce + ombre qui respire
  gsap.to(floatG.position, { y: 0.045, duration: 2.2, yoyo: true, repeat: -1, ease: 'sine.inOut' });
  gsap.to(shadow.scale, { x: 0.88, y: 0.88, duration: 2.2, yoyo: true, repeat: -1, ease: 'sine.inOut' });
  gsap.to(shadow.material, { opacity: 0.75, duration: 2.2, yoyo: true, repeat: -1, ease: 'sine.inOut' });

  // Glisser pour tourner
  let lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', e => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
    clearTimeout(resumeTimer);
    if (spin) { spin.kill(); spin = null; }
    gsap.killTweensOf(can.rotation); gsap.killTweensOf(pivot.rotation);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    can.rotation.y += (e.clientX - lx) * 0.012;
    pivot.rotation.x = THREE.MathUtils.clamp(pivot.rotation.x + (e.clientY - ly) * 0.006, -1.3, 1.3);
    lx = e.clientX; ly = e.clientY;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false; canvas.classList.remove('dragging');
    if (playing) { resumeTimer = setTimeout(() => { startSpin(); levelOut(); }, 900); }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // Boutons
  btnSpin.addEventListener('click', () => { playing ? stopSpin() : (startSpin(), levelOut()); });
  const VIEWS = { front: [0, 0], back: [Math.PI, 0], top: [0, 1.15], bottom: [0, -1.15] };
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goTo(b.dataset.view)));
  function goTo(name) {
    const [ry, rx] = VIEWS[name];
    stopSpin();
    const cur = can.rotation.y;
    const target = Math.round((cur - ry) / TAU) * TAU + ry;
    gsap.to(can.rotation, { y: target, duration: 1.2, ease: 'power3.inOut' });
    gsap.to(pivot.rotation, { x: rx, duration: 1.2, ease: 'power3.inOut' });
  }

  // Parallaxe légère de la caméra avec la souris
  const look = new THREE.Vector3();
  window.addEventListener('pointermove', e => {
    if (dragging) return;
    const nx = e.clientX / window.innerWidth - 0.5, ny = e.clientY / window.innerHeight - 0.5;
    gsap.to(look, { x: nx * 0.25, y: -ny * 0.12, duration: 1, ease: 'power2.out', overwrite: true });
  });

  renderer.setAnimationLoop(() => {
    camera.position.x = look.x; camera.position.y = 0.1 + look.y;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  });

  window.__bssap = { can, pivot, goTo, stopSpin };
})();
</script>
</body>
</html>
